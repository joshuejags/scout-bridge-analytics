services:
  mongodb:
    image: mongo:6.0
    container_name: scout-bridge-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - '27018:27017'
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: scout-bridge-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: scout-bridge-server
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://root:password123@mongodb:27017/scout-bridge-analytics?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_FALLBACK_MODE=false
      - PORT=5000
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MAX_FILE_SIZE=500000000
      - CLIENT_URL=http://localhost:3001
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    ports:
      - '5002:5000'
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
      - uploads_data:/app/uploads

  analysis-worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: scout-bridge-analysis-worker
    command: ["node", "scripts/analysisDaemon.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://root:password123@mongodb:27017/scout-bridge-analytics?authSource=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DISABLE_FALLBACK_MODE=true
      - ANALYSIS_WORKER_POOL_SIZE=${ANALYSIS_WORKER_POOL_SIZE:-2}
      - ANALYSIS_JOB_TIMEOUT=${ANALYSIS_JOB_TIMEOUT:-1800000}
      - ANALYSIS_JOB_MAX_ATTEMPTS=${ANALYSIS_JOB_MAX_ATTEMPTS:-3}
      - ANALYZER_MAX_FRAMES=${ANALYZER_MAX_FRAMES:-}
      - UPLOAD_DIR=/app/uploads
    depends_on:
      - mongodb
      - redis
    volumes:
      - uploads_data:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: scout-bridge-client
    environment:
      - REACT_APP_API_URL=http://localhost:5002/api
    ports:
      - '3001:3000'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongodb_data:
  redis_data:
  uploads_data:
