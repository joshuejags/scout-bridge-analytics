services:
  mongodb:
    image: mongo:6.0
    container_name: scout-bridge-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: scout-bridge-server
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://root:password123@mongodb:27017/scout-bridge-analytics?authSource=admin
      - PORT=5000
      # Overridden with a real secret via a .env file (docker compose reads
      # .env from the project root automatically) or `docker compose run -e`;
      # this placeholder only avoids a hard crash on `up` with no config.
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - MAX_FILE_SIZE=500000000
      - CLIENT_URL=http://localhost:3000
      # Set real SMTP_* values to send real password-reset/verification
      # emails; unset (the default here) logs them to this container's
      # console instead — see server/utils/email.js.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: scout-bridge-client
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - '3000:3000'
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules

volumes:
  mongodb_data:
