name: Database Backup

# Runs server/scripts/backupDatabase.js on a schedule: mongodump piped
# straight into S3, then prunes backups older than BACKUP_RETENTION_DAYS.
# Inert without configuration — needs these repo secrets to actually do
# anything (see README.md "Backups" for the full explanation of each):
#   MONGODB_URI          — the real production connection string
#   BACKUP_S3_BUCKET      — destination bucket (kept separate from video
#                           storage on purpose — see the script's comments)
#   S3_REGION             — required by the AWS SDK even for non-AWS providers
#   S3_ACCESS_KEY_ID       — omit both key secrets to use the AWS SDK's normal
#   S3_SECRET_ACCESS_KEY    credential chain (e.g. an IAM role) instead
#   S3_ENDPOINT            — only for a non-AWS S3-compatible provider
# Until those are set, scheduled runs will fail fast with a clear "not
# configured" message rather than silently doing nothing — same "loud
# about what it's actually doing" principle as utils/email.js.
on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch: {} # manual "Run workflow" button, for testing this

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # mongodump isn't preinstalled on GitHub's runners — MongoDB's own
      # apt repo isn't configured by default either, so this grabs the
      # official Database Tools package directly rather than adding a
      # whole extra apt source for one binary.
      - name: Install MongoDB Database Tools (mongodump)
        run: |
          curl -fsSL -o mongodb-database-tools.deb \
            https://fastdl.mongodb.org/tools/db/mongodb-database-tools-ubuntu2204-x86_64-100.9.4.deb
          sudo dpkg -i mongodb-database-tools.deb
          mongodump --version

      - name: Run backup
        run: node scripts/backupDatabase.js
        working-directory: server
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_RETENTION_DAYS: '30'
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
